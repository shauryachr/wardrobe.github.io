<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Virtual Wardrobe</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Montserrat&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#C9A84C;
  --dark:#0D0C0A;
  --dark2:#1A1814;
  --cream:#FAF7F2;
  --muted:#777;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--dark);
  color:var(--cream);
  font-family:Montserrat;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.container{
  width:100%;
  max-width:380px;
  padding:2.5rem;
  background:var(--dark2);
  border:1px solid rgba(201,168,76,0.25);
}

.logo{
  text-align:center;
  font-family:'Cormorant Garamond', serif;
  font-size:22px;
  letter-spacing:2px;
  margin-bottom:1.5rem;
}
.logo span{color:var(--gold);}

h2{
  text-align:center;
  font-weight:300;
  margin-bottom:1.5rem;
}

.input-group{
  margin-bottom:1.2rem;
}

label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:12px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.1);
  color:var(--cream);
  outline:none;
}

input:focus{
  border-color:var(--gold);
}

.password-wrap{
  position:relative;
}

.toggle{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
}

button{
  width:100%;
  padding:14px;
  margin-top:1rem;
  background:var(--gold);
  border:none;
  color:black;
  cursor:pointer;
  font-size:12px;
  letter-spacing:1px;
}

.links{
  margin-top:1rem;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

.links a{
  color:var(--gold);
  text-decoration:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:1.5rem;
  font-size:11px;
  color:var(--muted);
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Virtual <span>Wardrobe</span>
  </div>

  <h2>Create Account</h2>

  <!-- EMAIL -->
  <div class="input-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">
  </div>

  <!-- PASSWORD -->
  <div class="input-group password-wrap">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
    <span class="toggle" onclick="togglePass('password')">Show</span>
  </div>

  <!-- CONFIRM PASSWORD -->
  <div class="input-group password-wrap">
    <label>Confirm Password</label>
    <input type="password" id="confirm" placeholder="Confirm password">
    <span class="toggle" onclick="togglePass('confirm')">Show</span>
  </div>

  <button type="button" onclick="signup()">Sign Up</button>

  <div class="links">
    Already have an account? <a href="login.html">Login</a>
  </div>

  <a href="index.html" class="back">? Back to Home</a>

</div>

<!-- FIREBASE + LOGIC -->
<script type="module">
import { auth } from './firebase.js';
import { createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

window.signup = async function(){

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const confirm = document.getElementById('confirm').value.trim();

  if(!email || !password || !confirm){
    alert("Please fill all fields");
    return;
  }

  if(password.length < 6){
    alert("Password must be at least 6 characters");
    return;
  }

  if(password !== confirm){
    alert("Passwords do not match");
    return;
  }

  const btn = document.querySelector("button");
  btn.innerText = "Creating...";
  btn.disabled = true;

  try{
    await createUserWithEmailAndPassword(auth, email, password);

    alert("Account created successfully ??");

    window.location.href = "app.html";

  }catch(error){
    alert(error.message);
  }

  btn.innerText = "Sign Up";
  btn.disabled = false;
}

// show/hide password
window.togglePass = function(id){
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
