<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Virtual Wardrobe</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --gold:#C9A84C;
      --dark:#0D0C0A;
      --dark2:#1A1814;
      --cream:#FAF7F2;
      --muted:#777;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      background:var(--dark);
      color:var(--cream);
      font-family:'Montserrat',sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    .container{
      width:100%;
      max-width:380px;
      padding:2.5rem;
      background:var(--dark2);
      border:1px solid rgba(201,168,76,0.2);
    }

    .logo{
      text-align:center;
      font-family:'Cormorant Garamond',serif;
      letter-spacing:2px;
      margin-bottom:2rem;
      font-size:22px;
    }

    .logo span{color:var(--gold);}

    h2{
      text-align:center;
      font-weight:300;
      margin-bottom:1.5rem;
    }

    .input-group{
      margin-bottom:1.2rem;
    }

    label{
      font-size:12px;
      color:var(--muted);
      display:block;
      margin-bottom:6px;
    }

    input{
      width:100%;
      padding:12px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.1);
      color:var(--cream);
      outline:none;
    }

    input:focus{
      border-color:var(--gold);
    }

    .password-wrap{
      position:relative;
    }

    .toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      font-size:12px;
      color:var(--muted);
      cursor:pointer;
    }

    .btn{
      width:100%;
      padding:14px;
      margin-top:1rem;
      background:var(--gold);
      color:black;
      border:none;
      cursor:pointer;
      font-size:12px;
      letter-spacing:1px;
    }

    .links{
      margin-top:1rem;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }

    .links a{
      color:var(--gold);
      text-decoration:none;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:1.5rem;
      font-size:11px;
      color:var(--muted);
      text-decoration:none;
    }

  </style>
</head>

<body>

<div class="container">
  
  <div class="logo">
    Virtual <span>Wardrobe</span>
  </div>

  <h2>Welcome Back</h2>

  <form onsubmit="login(event)">
    
    <div class="input-group">
      <label>Email</label>
      <input type="email" required>
    </div>

    <div class="input-group password-wrap">
      <label>Password</label>
      <input type="password" id="password" required>
      <span class="toggle" onclick="togglePass()">Show</span>
    </div>

    <button class="btn">Login</button>
  </form>

  <div class="links">
    Don’t have an account? <a href="#">Sign up</a>
  </div>


  <a href="index.html" class="back">? Back to Home</a>

</div>

<script>
  function togglePass(){
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function login(e){
    e.preventDefault();

    // TEMP DEMO LOGIN
    window.location.href = "app.html";
  }
</script>

</body>
</html>
